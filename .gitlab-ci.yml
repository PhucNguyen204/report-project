stages: [verify, integration]

variables:
  GOTOOLCHAIN: local
  GIT_DEPTH: "0"
  GOPATH: "$CI_PROJECT_DIR/.cache/go"

.go:
  image: golang:1.26.11-alpine@sha256:ae52b5bc6ed045a9ed26ab03dc19327a802a9cc9aa8b27ed57f5c6b60579b0bb
  cache:
    key:
      files: [backend/go.sum]
    paths: [.cache/go/pkg/mod/]
  before_script:
    - apk add --no-cache bash make python3 git gcc musl-dev poppler-utils tzdata
    - cd backend

backend-verify:
  extends: .go
  stage: verify
  script:
    - make verify openapi security secrets fuzz

  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - output/backend-qa/gitleaks-reviewed.json
      - output/backend-qa/fuzz-*.log
      - backend/internal/**/testdata/fuzz/

backend-integration:
  extends: .go
  stage: integration
  variables:
    POSTGRES_USER: dicho
    POSTGRES_PASSWORD: dicho-local-test
    POSTGRES_DB: dicho_test
    AWS_ACCESS_KEY_ID: dicho-test
    AWS_SECRET_ACCESS_KEY: dicho-local-storage-test
    S3_BUCKET: media
    TEST_DATABASE_URL: postgres://dicho:dicho-local-test@postgres:5432/dicho_test?sslmode=disable
    TEST_REDIS_URL: redis://redis:6379/0
    TEST_S3_ENDPOINT: http://s3:8333
    TEST_SMTP_ADDR: mailpit:1025
    TEST_MAILPIT_URL: http://mailpit:8025
  services:
    - name: postgres@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
      alias: postgres
    - name: redis@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
      alias: redis
    - name: chrislusf/seaweedfs@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
      alias: s3
      command: [mini, '-dir=/data']
    - name: axllent/mailpit@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
      alias: mailpit
  script:
    - make integration
  coverage: '/TOTAL_COVERAGE: [0-9]+\.[0-9]+%/'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - output/backend-qa/integration.jsonl
      - output/backend-qa/coverage.out
      - output/backend-qa/coverage-summary.json
